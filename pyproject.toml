[project]
name = "vista-bench"
version = "1.0.0"
description = "VISTA: A Benchmark for Spatio-Temporal Interaction Understanding in Videos (evaluation code)"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Alejandro Aparcedo"}]
requires-python = ">=3.9"
dependencies = ["numpy", "opencv-python", "Pillow", "PyYAML", "tqdm", "pandas"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["vista"]
